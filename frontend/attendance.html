<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AttendX - Mark Attendance</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-900 text-white flex items-center justify-center p-6">

    <div class="w-full max-w-lg">

        <!-- Header -->
        <div class="text-center mb-8">

            <div class="inline-flex items-center justify-center
                        w-16 h-16 rounded-2xl
                        bg-gradient-to-br from-violet-500 to-purple-600
                        mb-4">

                <span class="text-3xl">▦</span>

            </div>

            <h1 class="text-3xl font-bold">
                AttendX
            </h1>

            <p class="text-slate-400 mt-2">
                Student Attendance
            </p>

        </div>


        <!-- Attendance Card -->
        <div class="bg-slate-800 border border-slate-700
                    rounded-2xl p-7 shadow-xl">

            <h2 class="text-2xl font-semibold mb-2">
                Mark Your Attendance
            </h2>

            <p class="text-slate-400 mb-6">
                Enter your details below to mark attendance.
            </p>


            <!-- Status -->
            <div id="status"
                 class="hidden mb-5 p-4 rounded-lg text-sm">
            </div>


            <form id="attendance-form">


                <!-- Lecture Name -->
                <div class="mb-5">

                    <label class="block text-sm font-medium mb-2">
                        Lecture Name
                    </label>

                    <input
                        type="text"
                        id="lecture-name"
                        readonly
                        class="w-full px-4 py-3 rounded-xl
                               bg-slate-700 border border-slate-600
                               text-white outline-none"
                        placeholder="Loading lecture..."
                    >

                </div>


                <!-- Student Name -->
                <div class="mb-5">

                    <label class="block text-sm font-medium mb-2">
                        Student Name
                    </label>

                    <input
                        type="text"
                        id="student-name"
                        required
                        class="w-full px-4 py-3 rounded-xl
                               bg-slate-700 border border-slate-600
                               text-white outline-none
                               focus:ring-2 focus:ring-violet-500"
                        placeholder="Enter your full name"
                    >

                </div>


                <!-- PRN -->
                <div class="mb-6">

                    <label class="block text-sm font-medium mb-2">
                        PRN / Student ID
                    </label>

                    <input
                        type="text"
                        id="student-id"
                        required
                        class="w-full px-4 py-3 rounded-xl
                               bg-slate-700 border border-slate-600
                               text-white outline-none
                               focus:ring-2 focus:ring-violet-500"
                        placeholder="Enter your PRN / Student ID"
                    >

                </div>


                <!-- Submit -->
                <button
                    type="submit"
                    id="submit-btn"
                    class="w-full py-3.5 rounded-xl
                           bg-gradient-to-r from-violet-500 to-purple-600
                           hover:from-violet-600 hover:to-purple-700
                           font-semibold transition">

                    ✓ Submit Attendance

                </button>

            </form>

        </div>


        <p class="text-center text-slate-500 text-sm mt-6">
            AttendX • Smart Attendance Management
        </p>

    </div>


<script>

const API_BASE = "http://10.246.247.39:5000/api";


// ==========================================
// API REQUEST
// ==========================================

async function apiRequest(endpoint, options = {}) {

    const response = await fetch(
        `${API_BASE}${endpoint}`,
        {
            headers: {
                "Content-Type": "application/json"
            },
            ...options
        }
    );


    const result =
        await response.json().catch(() => ({}));


    if (!response.ok || result.success === false) {

        throw new Error(
            result.message ||
            "Something went wrong"
        );
    }


    return result;
}


// ==========================================
// SHOW STATUS
// ==========================================

function showStatus(message, type) {

    const status =
        document.getElementById("status");


    status.textContent = message;

    status.classList.remove(
        "hidden",
        "bg-green-900",
        "bg-red-900",
        "text-green-200",
        "text-red-200"
    );


    if (type === "success") {

        status.classList.add(
            "bg-green-900",
            "text-green-200"
        );

    } else {

        status.classList.add(
            "bg-red-900",
            "text-red-200"
        );
    }
}


// ==========================================
// GET LECTURE ID FROM QR URL
// ==========================================

const params =
    new URLSearchParams(window.location.search);


const lectureId =
    params.get("lecture_id");


// ==========================================
// LOAD LECTURE
// ==========================================

async function loadLecture() {

    if (!lectureId) {

        showStatus(
            "Invalid QR code. Lecture information is missing.",
            "error"
        );

        document.getElementById(
            "submit-btn"
        ).disabled = true;

        return;
    }


    try {

        const result =
            await apiRequest("/lectures");


        const lectures =
            Array.isArray(result)
                ? result
                : result.data || [];


        const lecture =
            lectures.find(
                item =>
                    item.lecture_id === lectureId
            );


        if (!lecture) {

            showStatus(
                "Lecture not found. This QR code may be invalid.",
                "error"
            );

            document.getElementById(
                "submit-btn"
            ).disabled = true;

            return;
        }


        // Show lecture name

        document.getElementById(
            "lecture-name"
        ).value = lecture.lecture_name;


    } catch (error) {

        console.error(error);

        showStatus(
            "Unable to connect to AttendX server.",
            "error"
        );
    }
}


// ==========================================
// SUBMIT ATTENDANCE
// ==========================================

document
    .getElementById("attendance-form")
    .addEventListener("submit", async function(event) {

        event.preventDefault();


        const studentName =
            document
                .getElementById("student-name")
                .value
                .trim();


        const studentId =
            document
                .getElementById("student-id")
                .value
                .trim();


        if (!lectureId) {

            showStatus(
                "Invalid lecture QR code.",
                "error"
            );

            return;
        }


        if (!studentName || !studentId) {

            showStatus(
                "Please enter your name and PRN.",
                "error"
            );

            return;
        }


        const submitButton =
            document.getElementById("submit-btn");


        submitButton.disabled = true;

        submitButton.textContent =
            "Submitting...";


        try {

            await apiRequest(
                "/attendance",
                {
                    method: "POST",

                    body: JSON.stringify({

                        lecture_id: lectureId,

                        student_name: studentName,

                        student_id: studentId

                    })
                }
            );


            showStatus(
                "✓ Attendance marked successfully!",
                "success"
            );


            submitButton.textContent =
                "✓ Attendance Submitted";


            document
                .getElementById("student-name")
                .disabled = true;


            document
                .getElementById("student-id")
                .disabled = true;


        } catch (error) {

            console.error(error);


            showStatus(
                error.message ||
                "Unable to mark attendance.",
                "error"
            );


            submitButton.disabled = false;

            submitButton.textContent =
                "✓ Submit Attendance";
        }

    });


// ==========================================
// START
// ==========================================

loadLecture();

</script>

</body>
</html>
